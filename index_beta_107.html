function locate(action){let m=window.GolfMap10;if(!m){alert('Mapa no disponible');return}let old=m.getRed();mapEdit=action;window.__golfMarking10=true;mapView();let courseForMark=selectedCourse();if(action.kind!=='course'&&validCoursePoint10(courseForMark?.center))m.goTo(courseForMark.center);const banner=document.createElement('div');banner.id='mapPrompt10';banner.style.cssText='position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 125px);left:14px;right:14px;background:#073f30;color:white;padding:15px;border:2px solid #b7f19b;border-radius:15px;text-align:center;box-shadow:0 4px 22px #0008;font-size:13px';banner.innerHTML='<b>📍 Toca el mapa para marcar la posición</b><br><small>Acércate con los dedos antes de marcar.</small><br><button id="cancelMap10" style="margin-top:8px;border:0;border-radius:7px;padding:8px 14px">Cancelar</button>';document.body.appendChild(banner);const cancel=()=>{banner.remove();m.getMap().off('click',capture);mapEdit=null;window.__golfMarking10=false;m.setRed(old);page(action.kind==='course'?'courses':'course')};$('cancelMap10').onclick=cancel;
function capture(e){const pt=[e.lngLat.lng,e.lngLat.lat];const c=selectedCourse();if(!validCoursePoint10(pt)){alert('Coordenadas GPS no válidas. Vuelve a marcar.');m.getMap().once('click',capture);return}if(action.kind!=='course'&&validCoursePoint10(c?.center)&&courseDistance10(pt,c.center)>12000){alert('El punto está a más de 12 km del campo. No se ha guardado. Acerca el mapa al campo y vuelve a marcar.');m.getMap().once('click',capture);return}banner.remove();mapEdit=null;window.__golfMarking10=false;setTimeout(()=>m.setRed(old),0);if(action.kind==='course'){let c=selectedCourse();if(c){c.center=pt;saveCourses();m.goTo(pt);editHole=1;page('course')}}else{let c=selectedCourse(),h=c?.holes?.[editHole];if(h){if(action.kind==='green')h.green=pt;else {h.tees??={};h.tees[action.color]=pt;}saveCourses();page('course')}}}m.getMap().once('click',capture);}
function renderStats(){const shots=read('golf-shots',[]),history=read('golf-scorecard-history-082',[]),score=window.GolfScore10?.getState();$('hubContent10').innerHTML=`<div class="hub-card10"><h3>Resumen de mi juego</h3><div class="hub-tags10"><span>Golpes GPS: ${shots.length}</span><span>Partida actual: ${score?.name?esc(score.name):'Sin datos'}</span></div><p class="hub-muted10">Las estadísticas avanzadas llegarán cuando tengamos más golpes registrados. De momento se conserva el historial y la exportación existente.</p><div class="hub-actions10">${btn('Ver resultados','results')}${btn('Historial de partidas','history')}${btn('Golpes registrados','shots')}</div></div>`;bind()}
function bind(){document.querySelectorAll('#hub10 [data-do10]').forEach(el=>el.onclick=()=>act(el.dataset.do10));document.querySelectorAll('#hub10 [data-course10]').forEach(el=>el.onclick=()=>{let id=el.dataset.course10;selected=id;editHole=1;page('course')});document.querySelectorAll('#hub10 [data-tee10]').forEach(el=>el.onclick=()=>{saveHoleForm();locate({kind:'tee',color:el.dataset.tee10})});document.querySelectorAll('#hub10 [data-remove10]').forEach(el=>el.onclick=()=>{readProfileForm();if(profile.clubs.length<=1)return alert('Mantén al menos un palo');profile.clubs.splice(Number(el.dataset.remove10),1);renderProfile()})}
function act(action){if(action==='addcourse'){page('newcourse');return}if(action==='createcourse'){let name=$('cname10').value.trim(),country=$('ccountry10').value.trim(),region=$('cregion10').value.trim(),count=Number($('ccount10').value);if(!name||!country)return alert('Indica nombre y país');if(courses.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.region.toLowerCase()===region.toLowerCase()))return alert('Ya tienes un campo con ese nombre en la región');let c={id:'c'+Date.now(),name,country,region,count,center:null,holes:{}};for(let i=1;i<=count;i++)c.holes[i]={par:4,si:i,green:null,tees:{}};courses.push(c);selected=c.id;saveCourses();locate({kind:'course'});return}if(action==='savecourse'){let c=selectedCourse();c.name=$('ename10').value.trim()||c.name;c.country=$('ecountry10').value.trim();c.region=$('eregion10').value.trim();saveCourses();renderCourse();return}if(action==='locatecourse'){saveHoleForm();locate({kind:'course'});return}if(action==='savehole'){saveHoleForm();alert('Hoyo guardado');return}if(action==='markgreen'){saveHoleForm();locate({kind:'green'});return}if(action==='cleargreen'){if(!confirm('¿Eliminar la posición del green de este hoyo?'))return;let c=selectedCourse();c.holes[editHole].green=null;saveCourses();renderCourse();return}if(action==='viewcourse'){saveHoleForm();let c=selectedCourse(),pt=validCoursePoint10(c.holes[editHole]?.green)?c.holes[editHole].green:c.center;if(validCoursePoint10(pt))window.GolfMap10?.goTo(pt);mapView();return}if(action==='deletecourse'){let c=selectedCourse();if(confirm('¿Eliminar '+c.name+' y todas sus coordenadas locales?')){courses=courses.filter(x=>x.id!==selected);saveCourses();selected=null;page('courses')}return}if(action==='playcourse'){saveHoleForm();let c=selectedCourse(),score=window.GolfScore10?.getState();if(score){score.courseId=c.id;score.course=c.name;score.hole=editHole;score.holes=Array.from({length:18},(_,i)=>({par:c.holes[i+1]?.par||4,si:c.holes[i+1]?.si||i+1}));window.GolfScore10.save()}mapView();window.GolfMap10?.refresh();return}if(action==='saveprofile'){readProfileForm();if(profile.clubs.length>13)return alert('Máximo 13 palos');if(new Set(profile.clubs.map(c=>c.id)).size!==profile.clubs.length)return alert('No repitas nombres de palo');saveProfile();alert('Perfil guardado en este dispositivo');renderProfile();return}if(action==='addclub'){readProfileForm();if(profile.clubs.length>=13)return alert('Máximo 13 palos');profile.clubs.push({id:'NUEVO'+(profile.clubs.length+1),carry:100,lat:12,lon:10});renderProfile();return}if(action==='propose'){propose();return}if(['results','history','shots'].includes(action)){mapView();if(action==='shots')$('registerBtn').click();else {window.GolfScore10?.show(action==='results'?'results':'history');navActive('party')}return}}
function newRound(){home();if(!confirm('¿Crear una nueva partida? La actual se conservará en el historial.'))return;mapView();window.GolfScore10?.newRound();navActive('party')}
function openParty(){mapView();window.GolfScore10?.show('entry');navActive('party')}
document.querySelectorAll('[data-home10]').forEach(b=>b.onclick=()=>{let a=b.dataset.home10;if(a==='new')newRound();else page(a==='profile'?'profile':a==='courses'?'courses':'stats')});$('continue10').onclick=mapView;$('hubBack10').onclick=()=>currentPage==='course'||currentPage==='newcourse'?page('courses'):home();
document.querySelectorAll('#nav090 [data-nav]').forEach(b=>b.onclick=()=>{let a=b.dataset.nav;if(a==='home')home();else if(a==='map')mapView();else if(a==='party')openParty();else if(a==='more'){window.GolfOpenSheet106?.('menu')}else page('courses')});
document.addEventListener('click',e=>{if(e.target?.id==='editCurrentCourse103'){let id=window.GolfScore10?.getState()?.courseId;let c=courses.find(c=>c.id===id)||courses.find(c=>c.id==='builtin');if(c){selected=c.id;editHole=Math.min(c.count,Math.max(1,window.GolfScore10?.getState()?.hole||1));page('course')}}});$('scoreBtn').addEventListener('click',()=>navActive('party'));$('closeBtn').addEventListener('click',()=>navActive('map'));
// Dynamic player inputs in existing setup: preserve entered values and rebuild fields before saving.
const sheet=$('sheetContent');sheet.addEventListener('change',e=>{if(e.target?.id!=='sc-count')return;const count=Number(e.target.value),blocks=Array.from(sheet.querySelectorAll('[id^="sc-name-"]')).map(x=>x.closest('div[style*="border-top"]'));const anchor=blocks[0];if(!anchor)return;let template=anchor.outerHTML;for(let i=0;i<count;i++){if(blocks[i])continue;let block=document.createElement('div');block.innerHTML=template.replaceAll(/sc-(name|index|tee|manual|hcp|shots)-0/g,(_,a)=>'sc-'+a+'-'+i).replace(/Jugador 1/g,'Jugador '+(i+1)).replace(/value="[^"]*"/g,match=>match);block=block.firstElementChild;block.querySelectorAll('input').forEach(x=>{if(x.type==='checkbox')x.checked=false;else if(x.id.startsWith('sc-name-'))x.value='Jugador '+(i+1);else if(x.id.startsWith('sc-index-')||x.id.startsWith('sc-hcp-'))x.value='0';else x.value=''});blocks.at(-1)?.after(block);blocks.push(block)}for(let i=blocks.length-1;i>=count;i--)blocks[i]?.remove();});
// On first load, show home without losing underlying map or score state.
setTimeout(home,100);
})();

</script><div id="golfMenu107" role="dialog" aria-modal="true" aria-label="Más opciones"><div class="golf-menu-box"><div class="gm-top"><h2 id="gmTitle107">⚙ Más opciones</h2><button type="button" class="gm-close" id="gmClose107" aria-label="Cerrar">×</button></div><div id="gmContent107"></div></div></div>
<script>
/* Beta 1.0.7: independent settings UI; works even if MapLibre is not initialized. */
(function(){'use strict';
const $=id=>document.getElementById(id),root=$('golfMenu107'),content=$('gmContent107');
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn('No se pudo guardar',e)}};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prefLabels={wind:'🌬 Viento',slope:'⛰ Desnivel',temp:'🌡 Temperatura',atmos:'🌤 Altitud / presión'};
function rowCheckbox(k,p){return '<div class="gm-row"><label for="gm-'+k+'">'+p+'</label><input type="checkbox" id="gm-'+k+'" data-gm-toggle="'+k+'" '+(read('golf-prefs',{})[k]?'checked':'')+'></div>'}
function rowNumber(k,label,p,step){return '<div class="gm-row"><label for="gm-'+k+'">'+label+'</label><input id="gm-'+k+'" data-gm-number="'+k+'" type="number" step="'+(step||1)+'" value="'+esc(Number(p[k]??0))+'"></div>'}
function updateEngine(){try{window.GolfApplySettings107?.()}catch(e){console.warn('Actualizar motor',e)}}
function open(page='menu'){
 const p=read('golf-prefs',{});root.classList.add('open');$('gmTitle107').textContent=page==='conditions'?'🌤 Condiciones de juego':'⚙ Más opciones';
 if(page==='menu'){
  content.innerHTML='<p class="gm-sub">Ajustes accesibles desde Inicio y desde el mapa, incluso si el mapa tarda en cargar.</p><div class="gm-group">Configuración</div><button class="gm-action" data-gm-page="conditions">🌤 Viento, temperatura, desnivel y altitud</button><div class="gm-group">Herramientas</div><button class="gm-action" data-gm-hub="profile">🏌 Mi perfil</button><button class="gm-action" data-gm-hub="courses">⛳ Campos</button><button class="gm-action" data-gm-hub="stats">📊 Mi juego</button><p class="gm-sub">Los ajustes se guardan en este dispositivo.</p>';
 }else{
  const enabled=read('golf-conditions-enabled-105',true),opened=read('golf-conditions-open-105',false);
  content.innerHTML='<p class="gm-sub">Selecciona los factores que quieres tener en cuenta. En el panel del mapa, rojo/negativo significa metros perdidos en vuelo; verde/positivo, metros ganados. Sobre la línea se muestra la compensación contraria.</p>'+ '<div class="gm-row"><label>Aplicar compensaciones</label><input type="checkbox" id="gmEnabled107" '+(enabled?'checked':'')+'></div><div class="gm-row"><label>Mostrar desglose en el mapa</label><input type="checkbox" id="gmOpen107" '+(opened?'checked':'')+'></div>' + Object.entries(prefLabels).map(([k,v])=>rowCheckbox(k,v)).join('') + '<div class="gm-group">Valores ambientales</div>'+rowNumber('windSpeed','Velocidad del viento (km/h)',p)+rowNumber('windFrom','Viento desde (°; 0 norte, 90 este)',p)+rowNumber('tempC','Temperatura (°C)',p,.5)+rowNumber('slopeM','Desnivel manual (m)',p)+rowNumber('slopeLayM','Desnivel manual hasta Lay Up (m)',p)+rowNumber('altitude','Altitud (m)',p)+rowNumber('pressure','Presión (hPa)',p)+rowNumber('winterAdjust','Ajuste de invierno (%)',p,.5)+'<div class="gm-row"><label>Priorizar desnivel manual</label><input type="checkbox" data-gm-toggle="manualElevation" '+(p.manualElevation?'checked':'')+'></div><button class="gm-action" data-gm-page="menu">← Volver a Más</button><button class="gm-action" id="gmSee107">✓ Guardar y ver desglose</button>';
 }
 content.querySelectorAll('[data-gm-page]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.gmPage)));
 content.querySelectorAll('[data-gm-hub]').forEach(b=>b.addEventListener('click',()=>{close();if(typeof window.GolfHubPage104==='function')window.GolfHubPage104(b.dataset.gmHub);else alert('La pantalla de '+b.textContent+' necesita que termine de cargar la aplicación.')}));
 content.querySelectorAll('[data-gm-toggle]').forEach(el=>el.addEventListener('change',()=>{let p=read('golf-prefs',{});p[el.dataset.gmToggle]=el.checked;write('golf-prefs',p);updateEngine()}));
 content.querySelectorAll('[data-gm-number]').forEach(el=>el.addEventListener('input',()=>{if(el.value==='')return;let p=read('golf-prefs',{});p[el.dataset.gmNumber]=Number(el.value);write('golf-prefs',p);updateEngine()}));
 $('gmEnabled107')?.addEventListener('change',e=>{write('golf-conditions-enabled-105',e.target.checked);updateEngine()});
 $('gmOpen107')?.addEventListener('change',e=>{write('golf-conditions-open-105',e.target.checked);updateEngine()});
 $('gmSee107')?.addEventListener('click',()=>{write('golf-conditions-enabled-105',true);write('golf-conditions-open-105',true);updateEngine();close()});
 }
 function close(){root.classList.remove('open')}
 $('gmClose107').addEventListener('click',close);
 root.addEventListener('click',e=>{if(e.target===root)close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.classList.contains('open'))close()});
 function onOpen(e){e.preventDefault();e.stopImmediatePropagation();open('menu')}
 for(const selector of ['.home-settings101','#nav090 [data-nav="more"]','#moreBtn'])document.querySelector(selector)?.addEventListener('click',onOpen,true);
 window.GolfSettings107={open,close};
})();
</script></body></html>
