n').onclick=()=>openSheet('menu');$('registerBtn').onclick=()=>openSheet('history');$('shotBtn').onclick=()=>{if(pending){openSheet('finish');return}let m=metrics(blue,lay&&green?green:red,lay&&green?prefs.slopeLayM:prefs.slopeM);pending={date:new Date().toISOString(),club:prefs.club,start:[...blue],aim:[...(lay&&green?green:red)],planned:m.d,adjusted:m.adj,conditions:{...prefs},end:null};toast('Golpe iniciado. Marca su posición final al llegar a la bola');redraw()};$('closeBtn').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};function fmtElevation(n){return Number.isFinite(n)?n.toFixed(1)+' m':'—'}function refreshElevationDiag(){const node=$('elevDiag');if(!node)return;const first=metrics(blue,lay&&green?green:red,lay&&green?prefs.slopeLayM:prefs.slopeM);const attempts=elevationState.attempts||[];node.innerHTML='<b>Diagnóstico de elevaciones</b><br>Preferencia: '+({auto:'Automática',europe:'Europa 25 m',global:'Global ~30 m',legacy:'Open-Meteo ~90 m'}[prefs.elevationProvider]||'Automática')+'<br>Fuente realmente utilizada: <b>'+elevationState.source+'</b><br>Salida: '+fmtElevation(elevationState.blue)+' · Objetivo: '+fmtElevation(elevationState.red)+(lay?' · Lay Up: '+fmtElevation(elevationState.green):'')+'<br>Desnivel efectivo: '+first.rise.toFixed(1)+' m<br>Estado: '+elevationState.status+(elevationState.fallback?' ⚠ Fuente alternativa (falló la prioritaria)':'')+'<br><b>Intentos de consulta:</b><br>'+(attempts.length?attempts.map(x=>'• '+x).join('<br>'):'Esperando respuesta...')+(location.protocol==='file:'?'<br><b>Nota:</b> abierto como archivo local. Para descartar restricciones de navegador, prueba en GitHub Pages.':'');}function openSheet(type){let html='';if(type==='menu')html='<h2>⚙ Más opciones</h2><div class="setting"><label>🌦 Condiciones de juego</label><button class="btn" data-open="conditions">Abrir</button></div><div class="setting"><label>🏌 Perfil y distancias</label><button class="btn" data-open="profile">Abrir</button></div><div class="setting"><label>📊 Historial</label><button class="btn" data-open="history">Ver</button></div><div class="setting"><label>📍 Ir a Gorraiz</label><button class="btn" id="gorraizBtn">Ir</button></div><p>Zoom máximo limitado para evitar teselas sin fotografía. Rotar mapa: gira con dos dedos. Norte arriba y objetivo arriba: botones laterales. Con Lay Up activado, los toques mueven el verde salvo que actives Salida u Objetivo. Arrastra cualquiera de los puntos directamente. El azul puede ser salida manual; pulsa ⌖ GPS para volver a la ubicación real.</p><p>* Compensaciones experimentales. Desnivel automático consultado a Open-Meteo Elevation cuando hay conexión; si falla, se usa el valor manual.</p>';if(type==='clubs')html='<h2>🏌 Seleccionar palo</h2><div class="flex">'+clubs.map(c=>'<button class="btn '+(prefs.club===c[0]?'active':'')+'" data-club="'+c[0]+'">'+c[0]+' · '+clubData(c[0]).d+' m</button>').join('')+'</div><p>Al seleccionar un palo, su elipse se centra en la distancia prevista del palo, siguiendo la línea hacia el objetivo. El objetivo no se mueve.</p><button class="btn" id="autoClub">Volver a palo recomendado</button>';if(type==='conditions'){let toggle=(k,t)=>'<div class="setting"><label>'+t+'</label><input type="checkbox" data-pref="'+k+'" '+(prefs[k]?'checked':'')+'></div>',num=(k,t)=>'<div class="setting"><label>'+t+'</label><input class="field" type="number" data-num="'+k+'" value="'+prefs[k]+'"></div>';html='<h2>🌦 Condiciones de juego</h2>'+toggle('wind','🌬 Compensar viento')+toggle('slope','⛰ Compensar desnivel')+toggle('temp','🌡 Compensar temperatura')+toggle('atmos','△ Compensar altitud/presión')+num('windSpeed','Viento km/h')+num('windFrom','Procedencia viento ° (0=N, 90=E)')+num('slopeM','Desnivel manual al objetivo (solo respaldo, m)')+(lay?num('slopeLayM','Desnivel manual salida → Lay Up (respaldo, m)'):'')+num('tempC','Temperatura °C')+num('altitude','Altitud m')+num('pressure','Presión hPa')+'<div class="setting"><label>Fuente de elevación</label><select class="field" id="elevProvider"><option value="auto">Automática: Europa 25 m → global ~30 m → respaldo</option><option value="europe">Priorizar Europa 25 m</option><option value="global">Global ~30 m</option><option value="legacy">Anterior ~90 m (comparación)</option></select></div>'+toggle('manualElevation','✎ Priorizar desnivel manual')+'<div id="elevDiag" style="padding:12px;background:#062e2a;border-radius:10px;line-height:1.7"></div><button class="btn" id="retryElev">↻ Reintentar elevaciones</button><p>La resolución es nominal, no precisión garantizada. El ajuste de 0,7 m por metro vertical sigue siendo experimental. La API pública OpenTopoData es para pruebas, no infraestructura comercial. Para resultados de máxima precisión en España necesitaremos un servicio LiDAR/MDT del IGN.</p>'}if(type==='profile')html='<h2>🏌 Mi perfil</h2><div class="setting"><label>Hándicap</label><input class="field" type="number" step=".1" data-num="hcp" value="'+prefs.hcp+'"></div><p>Distancia habitual carry por palo (m)</p>'+clubs.map(c=>'<div class="setting"><label>'+c[0]+'</label><input class="field" type="number" data-distance="'+c[0]+'" value="'+clubData(c[0]).d+'"></div>').join('');if(type==='finish')html='<h2>📍 Terminar golpe</h2><p>Marca dónde terminó la bola. Se guarda posición final, no el primer bote.</p><div class="flex"><button class="btn" id="useGps">Estoy en la bola (GPS)</button><button class="btn" id="manualBall">Marcar en mapa</button></div><p>'+(pending?.end?'Posición marcada':'Posición pendiente')+'</p><div class="flex"><button class="btn active" id="saveShot">Guardar golpe</button><button class="btn" id="cancelShot">Descartar</button></div>';if(type==='history')html='<h2>📊 Historial ('+shots.length+')</h2>'+(shots.length?shots.slice().reverse().map(s=>'<div class="setting"><label><b>'+s.club+'</b> · '+new Date(s.date).toLocaleString('es-ES')+'<br><small>Objetivo '+Math.
