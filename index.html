(function(){'use strict';const $=id=>document.getElementById(id);const safe=(key,def)=>{try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}};const save=(key,value)=>localStorage.setItem(key,JSON.stringify(value));const center=[42.8269,-1.5668];const map=L.map('map',{zoomControl:false}).setView(center,17);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri and providers'}).addTo(map);const clubs=[['W56',75,7,6],['W52',90,8,7],['PW',105,9,8],['H9',120,10,8],['H8',132,12,9],['H7',145,14,10],['H6',157,16,12],['H5',168,18,14],['HY21',180,21,16],['M15',205,26,20],['DR',230,32,23]];let prefs=safe('golf-prefs',{hcp:5.9,club:'H7',wind:true,slope:false,temp:false,atmos:false,windSpeed:0,windFrom:270,tempC:15,altitude:450,slopeM:0,pressure:960,distances:{}});let shots=safe('golf-shots',[]);let start=L.latLng(center[0]-.001,center[1]-.001),aim=L.latLng(center[0],center[1]),gps=null,watchId=null,mode='aim',pending=null,ballMarker=null;const icon=(cls)=>L.divIcon({html:'<div class="'+cls+'"></div>',iconSize:[22,22],iconAnchor:[11,11],className:''});let startMarker=L.marker(start,{icon:icon('dot'),draggable:true}).addTo(map),aimMarker=L.marker(aim,{icon:icon('target'),draggable:true}).addTo(map),line=L.polyline([start,aim],{color:'#fff',weight:2,dashArray:'6 8'}).addTo(map),ellipse=L.polygon([],{color:'#ffb33d',weight:2,fillColor:'#f4a134',fillOpacity:.24,dashArray:'5 5'}).addTo(map),gpsCircle=null;function rad(x){return x*Math.PI/180}function deg(x){return x*180/Math.PI}function bearing(a,b){let d=rad(b.lng-a.lng),y=Math.sin(d)*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(d);return (deg(Math.atan2(y,x))+360)%360}function destination(p,b,d){const R=6371000,t=rad(b),delta=d/R,phi=rad(p.lat),lam=rad(p.lng),p2=Math.asin(Math.sin(phi)*Math.cos(delta)+Math.cos(phi)*Math.sin(delta)*Math.cos(t)),l2=lam+Math.atan2(Math.sin(t)*Math.sin(delta)*Math.cos(phi),Math.cos(delta)-Math.sin(phi)*Math.sin(p2));return L.latLng(deg(p2),deg(l2))}function conf(){let c=clubs.find(x=>x[0]===prefs.club)||clubs[5];return {name:c[0],distance:Number(prefs.distances[c[0]])||c[1],lat:c[2],lon:c[3]}}function windComponents(b){let toward=(prefs.windFrom+180)%360,angle=rad(toward-b);return {along:prefs.windSpeed*Math.cos(angle),cross:prefs.windSpeed*Math.sin(angle)}}function calc(){let c=conf(),dist=start.distanceTo(aim),b=bearing(start,aim),w=windComponents(b),s=prefs.slope?Number(prefs.slopeM):0,head=prefs.wind?-w.along:0,side=prefs.wind?w.cross:0;let windAdj=head*.32;let tempAdj=prefs.temp?(15-prefs.tempC)*.10:0;let atmAdj=prefs.atmos?((450-prefs.altitude)*.002+(prefs.pressure-960)*.008):0;let equivalent=Math.max(1,dist+s*.7+windAdj+tempAdj+atmAdj);let scale=Math.max(.08,dist/c.distance),spreadFactor=1+Math.max(-.15,Math.min(.30,head*.009))+Math.abs(side)*.004;let lat=c.lat*scale*spreadFactor,lon=c.lon*scale*(1+Math.max(-.12,Math.min(.4,head*.012)));let centerShift=prefs.wind?side*.20:0;let centroid=destination(aim,(b+90)%360,centerShift);let coords=[];for(let i=0;i<=72;i++){let a=2*Math.PI*i/72,forward=Math.cos(a)*lon,lateral=Math.sin(a)*lat,p=destination(centroid,b,forward);p=destination(p,b+90,lateral);coords.push(p)}return {dist,equivalent,lat,lon,coords,b,wind:w}}function render(){let r=calc();line.setLatLngs([start,aim]);ellipse.setLatLngs(r.coords);$('meters').textContent=Math.round(r.dist);$('adjusted').textContent=Math.round(r.equivalent);$('adjusted').title='Diferencia respecto al GPS: '+(r.equivalent-r.dist>=0?'+':'')+(r.equivalent-r.dist).toFixed(1)+' m';$('club').textContent=prefs.club;$('latSpread').textContent='±'+r.lat.toFixed(1)+' m';$('longSpread').textContent='±'+r.lon.toFixed(1)+' m';$('count').textContent=shots.length;$('windLabel').textContent='🌬 '+prefs.windSpeed+' km/h';$('slopeLabel').textContent='⛰ '+(prefs.slopeM>0?'+':'')+prefs.slopeM+' m'+(prefs.slope?' ✓':' (off)');$('tempLabel').textContent='🌡 '+prefs.tempC+' °C';$('altLabel').textContent='△ '+prefs.altitude+' m';$('shotBtn').textContent=pending?'📍 Estoy en la bola / Marcar final':'⛳ Registrar golpe';save('golf-prefs',prefs)}function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}function setStart(p){start=L.latLng(p);startMarker.setLatLng(start);render()}function setAim(p){aim=L.latLng(p);aimMarker.setLatLng(aim);render()}map.on('click',e=>{if(mode==='ball'&&pending){pending.end=[e.latlng.lat,e.latlng.lng];showBall(e.latlng);toast('Punto final marcado. Pulsa Guardar golpe en el menú.');openSheet('finish');return}if(mode==='start'){setStart(e.latlng);mode='aim';toast('Salida fijada. Toca el mapa para mover el objetivo.')}else setAim(e.latlng)});startMarker.on('dragend',()=>setStart(startMarker.getLatLng()));aimMarker.on('dragend',()=>setAim(aimMarker.getLatLng()));function gpsUpdate(p,accuracy){gps=L.latLng(p);if(!pending){setStart(gps)}if(!gpsCircle)gpsCircle=L.circle(gps,{radius:accuracy,color:'#2588fa',weight:1,fillOpacity:.07}).addTo(map);else gpsCircle.setLatLng(gps).setRadius(accuracy);$('status').textContent='GPS activo · Precisión ±'+Math.round(accuracy)+' m'}$('gpsBtn').onclick=()=>{if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;$('gpsBtn').textContent='◎ GPS';$('status').textContent='GPS pausado';return}if(!navigator.geolocation){toast('Este navegador no permite GPS');return}watchId=navigator.geolocation.watchPosition(p=>{gpsUpdate([p.coords.latitude,p.coords.longitude],p.coords.accuracy);$('gpsBtn').textContent='● GPS';},e=>toast('No se pudo obtener GPS: '+e.message),{enableHighAccuracy:true,maximumAge:1500,timeout:15000})};$('centerBtn').onclick=()=>map.setView(gps||start,18);$('gorraizBtn').onclick=()=>map.setView(center,17);$('zoomBtn').onclick=()=>map.zoomIn();$('aimBtn').onclick=()=>{mode='aim';toast('Toca el mapa para marcar objetivo')};$('clubBtn').onclick=()=>openSheet('clubs');$('moreBtn').onclick=()=>openSheet('menu');$('shotBtn').onclick=()=>{if(!pending){let r=calc();pending={date:new Date().toISOString(),club:prefs.club,start:[start.lat,start.lng],aim:[aim.lat,aim.lng],planned:r.dist,conditions:{...prefs},end:null};toast('Golpe iniciado. Camina hasta la bola y pulsa el botón naranja.');render()}else openSheet('finish')};function showBall(p){if(ballMarker)map.removeLayer(ballMarker);ballMarker=L.marker(p,{icon:icon('hit'),draggable:true}).addTo(map);ballMarker.on('dragend',()=>{pending.end=[ballMarker.getLatLng().lat,ballMarker.getLatLng().lng]})}function close(){ $('overlay').classList.remove('open');setTimeout(()=>map.invalidateSize(),80)}$('closeBtn').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};function openSheet(type){let html='';if(type==='menu'){html='<h2>☰ Opciones</h2><div class="setting"><label>🌦 Condiciones de juego</label><button class="btn" data-open="conditions">Abrir</button></div><div class="setting"><label>🏌️ Perfil y distancias</label><button class="btn" data-open="profile">Abrir</button></div><div class="setting"><label>📊 Historial de golpes</label><button class="btn" data-open="history">Ver</button></div><div class="setting"><label>🔵 Mover salida manualmente</label><button class="btn" id="moveStart">Elegir</button></div><p>* Distancias equivalentes y dispersiones con condiciones: modelo experimental, no validado. No utilizar ayudas restringidas durante competiciones.</p>'}if(type==='clubs'){html='<h2>🏌️ Seleccionar palo</h2><div class="flex">'+clubs.map(c=>'<button class="btn '+(prefs.club===c[0]?'active':'')+'" data-club="'+c[0]+'">'+c[0]+' · '+(prefs.distances[c[0]]||c[1])+' m</button>').join('')+'</div><p>Las distancias se editan en Perfil y distancias.</p>'}if(type==='conditions'){let toggle=(k,title,desc)=>'<div class="setting"><label>'+title+'<br><span class="legend">'+desc+'</span></label><input type="checkbox" data-pref="'+k+'" '+(prefs[k]?'checked':'')+'></div>';html='<h2>🌦 Condiciones de juego</h2>'+toggle('wind','🌬 Viento','Ajustar distancia y dispersión')+toggle('slope','⛰ Desnivel','ACTIVAR para corregir la distancia equivalente. Introduce abajo los metros de desnivel.')+toggle('temp','🌡 Temperatura','Corrección atmosférica experimental')+toggle('atmos','△ Altitud y presión','Corrección atmosférica experimental')+'<div class="setting"><label>Viento (km/h)</label><input class="field" type="number" min="0" max="100" data-num="windSpeed" value="'+prefs.windSpeed+'"></div><div class="setting"><label>Dirección de procedencia (°)<br><span class="legend">0=N, 90=E, 180=S, 270=O</span></label><input class="field" type="number" min="0" max="359" data-num="windFrom" value="'+prefs.windFrom+'"></div><div class="setting"><label>Desnivel objetivo (m)<br><span class="legend">Positivo = objetivo más alto. Ejemplo: +8 m aumenta la distancia equivalente unos 5,6 m (modelo provisional). El desnivel NO se obtiene automáticamente todavía</span></label><input class="field" type="number" data-num="slopeM" value="'+prefs.slopeM+'"></div><div class="setting"><label>Temperatura (°C)</label><input class="field" type="number" data-num="tempC" value="'+prefs.tempC+'"></div><div class="setting"><label>Altitud del campo (m)</label><input class="field" type="number" data-num="altitude" value="'+prefs.altitude+'"></div><div class="setting"><label>Presión local (hPa)</label><input class="field" type="number" data-num="pressure" value="'+prefs.pressure+'"></div><p><b>Importante:</b> si el desnivel está en 0 m, activar la casilla no cambia la distancia. Introduce, por ejemplo, +8 m para comprobarlo. Los datos se introducen manualmente en esta beta. No hay consulta meteorológica ni de elevaciones automática. Las correcciones son demostrativas y no sustituyen mediciones fiables.</p>'}if(type==='profile'){html='<h2>🏌️ Mi perfil</h2><div class="setting"><label>Hándicap</label><input class="field" type="number" step="0.1" data-num="hcp" value="'+prefs.hcp+'"></div><p>Distancia habitual de vuelo (carry) por palo, en metros.</p>'+clubs.map(c=>'<div class="setting"><label>'+c[0]+'</label><input class="field" type="number" min="10" max="350" data-distance="'+c[0]+'" value="'+(prefs.distances[c[0]]||c[1])+'"></div>').join('')+'<p>El hándicap se guarda; la calibración estadística por hándicap y el aprendizaje de dispersión aún no están implementados.</p>'}if(type==='finish'){html='<h2>📍 Registrar posición final</h2><p>Cuando llegues a la bola, usa el GPS o marca manualmente dónde ha terminado. También puedes arrastrar el marcador rojo.</p><div class="flex"><button class="btn" id="useGps">🔵 Estoy en la bola</button><button class="btn" id="manualBall">🎯 Marcar en mapa</button></div><p id="ballState">'+(pending?.end?'Posición final marcada':'Posición final pendiente')+'</p><div class="flex"><button class="btn active" id="saveShot">Guardar golpe</button><button class="btn" id="cancelShot">Descartar golpe</button></div><p>Se registra la posición final, no el primer bote (carry). La precisión del GPS puede introducir errores.</p>'}if(type==='history'){html='<h2>📊 Golpes registrados ('+shots.length+')</h2>'+(shots.length?shots.slice().reverse().map((s,i)=>'<div class="setting"><label><b>'+s.club+'</b> · '+Math.round(s.planned)+' m objetivo<br><span class="legend">'+new Date(s.date).toLocaleString('es-ES')+' · '+Math.round(s.total)+' m final · lateral '+s.lateral.toFixed(1)+' m · largo '+s.longitudinal.toFixed(1)+' m</span></label></div>').join(''):'<p>Aún no hay golpes guardados.</p>')+'<button class="btn" id="exportBtn">⬇ Exportar datos CSV</button>'} $('sheetContent').innerHTML=html;$('overlay').classList.add('open');$('sheetContent').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));$('sheetContent').querySelectorAll('[data-club]').forEach(b=>b.onclick=()=>{prefs.club=b.dataset.club;render();close()});$('sheetContent').querySelectorAll('[data-pref]').forEach(el=>el.onchange=()=>{pr function saveShot(){if(!pending?.end){toast('Primero marca dónde terminó la bola');return}let a=L.latLng(pending.start),t=L.latLng(pending.aim),end=L.latLng(pending.end),b=bearing(a,t),be=bearing(a,end),d=a.distanceTo(end),diff=rad(be-b),longitudinal=d*Math.cos(diff)-a.distanceTo(t),lateral=d*Math.sin(diff);shots.push({...pending,total:d,lateral,longitudinal});save('golf-shots',shots);pending=null;mode='aim';if(ballMarker){map.removeLayer(ballMarker);ballMarker=null}close();render();toast('Golpe guardado en este iPhone')}
function exportCsv(){const rows=[['fecha','palo','distancia_objetivo_m','distancia_final_m','desviacion_lateral_m','desviacion_largo_m','salida_lat','salida_lon','objetivo_lat','objetivo_lon','final_lat','final_lon'],...shots.map(s=>[s.date,s.club,s.planned,s.total,s.lateral,s.longitudinal,...s.start,...s.aim,...s.end])];let csv=rows.map(r=>r.join(';')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='golf-gps-golpes.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();})();
