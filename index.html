function selectedCourse(){return courses.find(c=>c.id===selected)}
function renderCourse(){let c=selectedCourse();if(!c){page('courses');return}let h=c.holes[editHole]||(c.holes[editHole]={par:4,si:editHole,green:null,tees:{}});$('hubContent10').innerHTML=`<div class="hub-card10"><h3>${esc(c.name)}</h3><p class="hub-muted10">${esc(c.region)} · ${esc(c.country)} · ${c.count} hoyos</p><div class="hub-row10"><label>Nombre</label><input id="ename10" value="${esc(c.name)}"></div><div class="hub-row10"><label>Región</label><input id="eregion10" value="${esc(c.region)}"></div><div class="hub-row10"><label>País</label><input id="ecountry10" value="${esc(c.country)}"></div><div class="hub-actions10">${btn('Guardar datos','savecourse','secondary')}${btn('📍 Cambiar ubicación','locatecourse','secondary')}</div></div><div class="hub-card10"><h3>Editar recorrido</h3><div class="hub-row10"><label>Hoyo</label><select id="editHole10">${Array.from({length:c.count},(_,i)=>`<option value="${i+1}" ${editHole===i+1?'selected':''}>Hoyo ${i+1}</option>`).join('')}</select></div><div class="hub-row10"><label>Par</label><select id="epar10">${[3,4,5,6].map(v=>`<option ${h.par===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="hub-row10"><label>Índice de hándicap</label><input id="esi10" type="number" min="1" max="18" value="${h.si}"></div><div class="hub-actions10">${btn(h.green?'⚑ Corregir green':'⚑ Marcar green','markgreen')}${btn('Ver mapa','viewcourse','secondary')}</div><p class="hub-muted10">Green: ${h.green?h.green[1].toFixed(5)+', '+h.green[0].toFixed(5):'No marcado'}</p><h3>Tees de salida</h3>${teeColors.map(color=>`<div class="hub-row10"><label>${({Negras:'⚫',Blancas:'⚪',Amarillas:'🟡',Azules:'🔵',Rojas:'🔴'}[color])} ${color}</label><span class="hub-muted10">${h.tees?.[color]?'✓':'—'}</span><button class="hub-btn10 secondary" data-tee10="${color}">${h.tees?.[color]?'Corregir':'Marcar'}</button></div>`).join('')}<div class="hub-actions10">${btn('Guardar hoyo','savehole','secondary')}</div></div><div class="hub-card10"><h3>Gestionar campo</h3><div class="hub-actions10">${btn('Jugar este campo','playcourse')}${btn('Eliminar campo','deletecourse','danger')}</div></div>`;bind();$('editHole10').onchange=()=>{saveHoleForm();editHole=Number($('editHole10').value);renderCourse()}}
function saveHoleForm(){let c=selectedCourse();if(!c)return;let h=c.holes[editHole]||(c.holes[editHole]={tees:{}});if($('epar10')){h.par=Number($('epar10').value);h.si=Number($('esi10').value)||editHole;saveCourses()}}
function locate(action){let m=window.GolfMap10;if(!m){alert('Mapa no disponible');return}let old=m.getRed();mapEdit=action;mapView();const banner=document.createElement('div');banner.id='mapPrompt10';banner.style.cssText='position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 125px);left:14px;right:14px;background:#073f30;color:white;padding:15px;border:2px solid #b7f19b;border-radius:15px;text-align:center;box-shadow:0 4px 22px #0008;font-size:13px';banner.innerHTML='<b>📍 Toca el mapa para marcar la posición</b><br><small>Acércate con los dedos antes de marcar.</small><br><button id="cancelMap10" style="margin-top:8px;border:0;border-radius:7px;padding:8px 14px">Cancelar</button>';document.body.appendChild(banner);const cancel=()=>{banner.remove();m.getMap().off('click',capture);mapEdit=null;m.setRed(old);page(action.kind==='course'?'courses':'course')};$('cancelMap10').onclick=cancel;
function capture(e){banner.remove();mapEdit=null;const pt=[e.lngLat.lng,e.lngLat.lat];setTimeout(()=>m.setRed(old),0);if(action.kind==='course'){let c=selectedCourse();if(c){c.center=pt;saveCourses();m.goTo(pt);editHole=1;page('course')}}else{let c=selectedCourse(),h=c?.holes?.[editHole];if(h){if(action.kind==='green')h.green=pt;else {h.tees??={};h.tees[action.color]=pt;}saveCourses();page('course')}}}m.getMap().once('click',capture);}
function renderStats(){const shots=read('golf-shots',[]),history=read('golf-scorecard-history-082',[]),score=window.GolfScore10?.getState();$('hubContent10').innerHTML=`<div class="hub-card10"><h3>Resumen de mi juego</h3><div class="hub-tags10"><span>Golpes GPS: ${shots.length}</span><span>Partida actual: ${score?.name?esc(score.name):'Sin datos'}</span></div><p class="hub-muted10">Las estadísticas avanzadas llegarán cuando tengamos más golpes registrados. De momento se conserva el historial y la exportación existente.</p><div class="hub-actions10">${btn('Ver resultados','results')}${btn('Historial de partidas','history')}${btn('Golpes registrados','shots')}</div></div>`;bind()}
function bind(){document.querySelectorAll('#hub10 [data-do10]').forEach(el=>el.onclick=()=>act(el.dataset.do10));document.querySelectorAll('#hub10 [data-course10]').forEach(el=>el.onclick=()=>{let id=el.dataset.course10;if(id==='builtin'){mapView();window.GolfMap10?.goTo([-1.5757277778,42.8207611111]);return}selected=id;editHole=1;page('course')});document.querySelectorAll('#hub10 [data-tee10]').forEach(el=>el.onclick=()=>{saveHoleForm();locate({kind:'tee',color:el.dataset.tee10})});document.querySelectorAll('#hub10 [data-remove10]').forEach(el=>el.onclick=()=>{readProfileForm();if(profile.clubs.length<=1)return alert('Mantén al menos un palo');profile.clubs.splice(Number(el.dataset.remove10),1);renderProfile()})}
function act(action){if(action==='addcourse'){page('newcourse');return}if(action==='createcourse'){let name=$('cname10').value.trim(),country=$('ccountry10').value.trim(),region=$('cregion10').value.trim(),count=Number($('ccount10').value);if(!name||!country)return alert('Indica nombre y país');if(courses.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.region.toLowerCase()===region.toLowerCase()))return alert('Ya tienes un campo con ese nombre en la región');let c={id:'c'+Date.now(),name,country,region,count,center:null,holes:{}};for(let i=1;i<=count;i++)c.holes[i]={par:4,si:i,green:null,tees:{}};courses.push(c);selected=c.id;saveCourses();locate({kind:'course'});return}if(action==='savecourse'){let c=selectedCourse();c.name=$('ename10').value.trim()||c.name;c.country=$('ecountry10').value.trim();c.region=$('eregion10').value.trim();saveCourses();renderCourse();return}if(action==='locatecourse'){saveHoleForm();locate({kind:'course'});return}if(action==='savehole'){saveHoleForm();alert('Hoyo guardado');return}if(action==='markgreen'){saveHoleForm();locate({kind:'green'});return}if(action==='viewcourse'){saveHoleForm();let c=selectedCourse(),pt=c.holes[editHole]?.green||c.center;if(pt)window.GolfMap10?.goTo(pt);mapView();return}if(action==='deletecourse'){let c=selectedCourse();if(confirm('¿Eliminar '+c.name+' y todas sus coordenadas locales?')){courses=courses.filter(x=>x.id!==selected);saveCourses();selected=null;page('courses')}return}if(action==='playcourse'){saveHoleForm();let c=selectedCourse(),score=window.GolfScore10?.getState();if(score){score.courseId=c.id;score.course=c.name;score.hole=editHole;score.holes=Array.from({length:18},(_,i)=>({par:c.holes[i+1]?.par||4,si:c.holes[i+1]?.si||i+1}));window.GolfScore10.save()}mapView();window.GolfMap10?.refresh();return}if(action==='saveprofile'){readProfileForm();if(profile.clubs.length>13)return alert('Máximo 13 palos');if(new Set(profile.clubs.map(c=>c.id)).size!==profile.clubs.length)return alert('No repitas nombres de palo');saveProfile();alert('Perfil guardado en este dispositivo');renderProfile();return}if(action==='addclub'){readProfileForm();if(profile.clubs.length>=13)return alert('Máximo 13 palos');profile.clubs.push({id:'NUEVO'+(profile.clubs.length+1),carry:100,lat:12,lon:10});renderProfile();return}if(action==='propose'){propose();return}if(['results','history','shots'].includes(action)){mapView();if(action==='shots')$('registerBtn').click();else {window.GolfScore10?.show(action==='results'?'results':'history');navActive('party')}return}}
function newRound(){home();if(!confirm('¿Crear una nueva partida? La actual se conservará en el historial.'))return;mapView();window.GolfScore10?.newRound();navActive('party')}
function openParty(){mapView();window.GolfScore10?.show('entry');navActive('party')}
document.querySelectorAll('[data-home10]').forEach(b=>b.onclick=()=>{let a=b.dataset.home10;if(a==='new')newRound();else page(a==='profile'?'profile':a==='courses'?'courses':'stats')});$('continue10').onclick=mapView;$('hubBack10').onclick=()=>currentPage==='course'||currentPage==='newcourse'?page('courses'):home();
document.querySelectorAll('#nav090 [data-nav]').forEach(b=>b.onclick=()=>{let a=b.dataset.nav;if(a==='home')home();else if(a==='map')mapView();else if(a==='party')openParty();else page('courses')});
$('scoreBtn').addEventListener('click',()=>navActive('party'));$('closeBtn').addEventListener('click',()=>navActive('map'));
// Dynamic player inputs in existing setup: preserve entered values and rebuild fields before saving.
const sheet=$('sheetContent');sheet.addEventListener('change',e=>{if(e.target?.id!=='sc-count')return;const count=Number(e.target.value),blocks=Array.from(sheet.querySelectorAll('[id^="sc-name-"]')).map(x=>x.closest('div[style*="border-top"]'));const anchor=blocks[0];if(!anchor)return;let template=anchor.outerHTML;for(let i=0;i<count;i++){if(blocks[i])continue;let block=document.createElement('div');block.innerHTML=template.replaceAll(/sc-(name|index|tee|manual|hcp|shots)-0/g,(_,a)=>'sc-'+a+'-'+i).replace(/Jugador 1/g,'Jugador '+(i+1)).replace(/value="[^"]*"/g,match=>match);block=block.firstElementChild;block.querySelectorAll('input').forEach(x=>{if(x.type==='checkbox')x.checked=false;else if(x.id.startsWith('sc-name-'))x.value='Jugador '+(i+1);else if(x.id.startsWith('sc-index-')||x.id.startsWith('sc-hcp-'))x.value='0';else x.value=''});blocks.at(-1)?.after(block);blocks.push(block)}for(let i=blocks.length-1;i>=count;i--)blocks[i]?.remove();});
// On first load, show home without losing underlying map or score state.
setTimeout(home,100);
})();

</script></body></html>
