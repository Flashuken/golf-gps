function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function shareCard(){const ts=totalsFor(state),canvas=document.createElement('canvas');canvas.width=1080;canvas.height=Math.max(650,310+ts.length*112);let ctx=canvas.getContext('2d');ctx.fillStyle='#103d32';ctx.fillRect(0,0,1080,canvas.height);ctx.fillStyle='#a7e8bf';ctx.font='bold 28px Arial';ctx.fillText('⛳ GOLF GPS · TARJETA DE PARTIDA',60,78);ctx.fillStyle='white';ctx.font='bold 54px Arial';ctx.fillText(state.course,60,150);ctx.font='28px Arial';ctx.fillStyle='#c8e5d7';ctx.fillText((state.date||'')+' · '+({individual:'Individual / Stableford',americana:'Americana',parejas:'Mejor y peor bola'}[state.mode]||state.mode),60,205);ts.forEach((t,i)=>{let y=285+i*112;ctx.fillStyle=i%2?'#245747':'#1b4b3d';ctx.fillRect(48,y-46,984,94);ctx.fillStyle='#fff';ctx.font='bold 33px Arial';ctx.fillText((i+1)+'. '+t.name.slice(0,25),70,y+9);ctx.textAlign='right';ctx.fillText(t.shots+' golpes',790,y+9);ctx.fillStyle='#b7eecb';ctx.fillText(t.points+' pts',1000,y+9);ctx.textAlign='left'});ctx.fillStyle='#b7eecb';ctx.font='24px Arial';ctx.fillText('Resultados provisionales o finales según los hoyos registrados',60,canvas.height-44);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)return alert('No se pudo generar la imagen');let file=new File([blob],'golf-gps-tarjeta.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Golf GPS · Resultados'});return}}catch(e){if(e.name==='AbortError')return}download('golf-gps-tarjeta.png',blob);alert('Imagen generada. Puedes enviarla por WhatsApp desde Fotos o desde tus archivos.')}
function act(a,page){let h=state.hole,par=state.holes[h-1].par;
if(['entry','card','setup','history'].includes(a)){show(a);return}
if(a==='saveSetup'){
state.course='Castillo de Gorraiz';state.date=$('sc-date').value;state.mode=$('sc-mode').value;let count=n($('sc-count').value,1),oldPlayers=state.players.slice();state.players=Array.from({length:count},(_,i)=>{let p=oldPlayers[i]||{name:'Jugador '+(i+1),index:0,tee:'Amarillas',manual:false,manualHcp:0};if(!$('sc-name-'+i))return p;return {name:$('sc-name-'+i).value,index:n($('sc-index-'+i).value),tee:$('sc-tee-'+i).value,manual:$('sc-manual-'+i).checked,manualHcp:n($('sc-hcp-'+i).value)}});state.holes=state.holes.map((old,i)=>({par:n($('sc-holepar-'+i).value,pars[i]),si:n($('sc-si-'+i).value,sis[i])}));save();show('entry');return}
if(a==='prev'||a==='next')state.hole=Math.max(1,Math.min(18,h+(a==='prev'?-1:1)));
if(a.startsWith('minus-')||a.startsWith('plus-')){let i=n(a.split('-')[1]);state.scores[h]??={};state.scores[h][i]=Math.max(1,(state.scores[h][i]??par)+(a.startsWith('plus')?1:-1))}
if(a==='puttminus'||a==='puttplus')state.putts[h]=Math.max(0,(state.putts[h]??2)+(a==='puttplus'?1:-1));
if(a.startsWith('fw-'))state.fairways[h]=a.slice(3);
if(a==='saveNext'){state.scores[h]??={};state.players.forEach((p,i)=>{if(state.scores[h][i]===undefined)state.scores[h][i]=par});if(state.putts[h]===undefined)state.putts[h]=2;state.hole=Math.min(18,h+1)}
if(a==='finish'){if(!confirm('¿Guardar esta vuelta en el historial?'))return;history.push(JSON.parse(JSON.stringify(state)));state=newState();save();show('history');return}
if(a==='share'){shareCard();return}
if(a==='backup'){download('golf-gps-historial.json',new Blob([JSON.stringify({history,current:state},null,2)],{type:'application/json'}));return}
if(a==='csv'){let rows=[['Hoyo','Par','Indice',...state.players.map(p=>p.name)],...state.holes.map((p,i)=>[i+1,p.par,p.si,...state.players.map((_,j)=>score(i+1,j)??'')])];download('golf-gps-tarjeta.csv',new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));return}
save();show(page)}
$('scoreBtn').addEventListener('click',()=>show('entry'));
})();
</script><script>
(function(){
 const nav=document.getElementById('nav090'),overlay=document.getElementById('overlay');
 function mark(which){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.nav===which));}
 nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  const where=b.dataset.nav;mark(where);
  if(where==='map'){overlay.classList.remove('open');return}
  document.getElementById('scoreBtn').click();
  const action=where==='party'?'entry':where==='card'?'card':'history';
  if(action!=='entry'){const x=document.querySelector('#sheetContent [data-action="'+action+'"]');if(x)x.click()}
 }));
 document.getElementById('closeBtn').addEventListener('click',()=>mark('map'));
 overlay.addEventListener('click',e=>{if(e.target===overlay)mark('map')});
 document.getElementById('scoreBtn').addEventListener('click',()=>mark('party'));
})();
</script></body></html>
